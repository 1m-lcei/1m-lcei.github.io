<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>作品ボード</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { background: linear-gradient(#ead8bd55, #ead8bd55), #ead8bd url("{{CORK}}") repeat; background-size: 720px 720px; }
    .board { position: relative; width: 100%; height: 100%; }
    .shot { position: absolute; margin: 0; padding: 32px 22px 32px; border: 1px solid #ded3bd; border-radius: 4px; background: #fffdf5 url("{{PAPER}}") repeat; background-size: 420px 420px; box-shadow: 0 10px 18px #543b2540, 0 2px 3px #543b2526; }
    .picker { left: -8px; top: 42px; width: 700px; rotate: -7deg; --pin: #71866a; }
    .ladder { left: 655px; top: 40px; width: 580px; rotate: 7deg; --pin: #b39654; }
    .measure { left: 115px; top: 260px; width: 970px; rotate: -3deg; --pin: #688c9d; }
    .pin { z-index: 2; position: absolute; top: 7px; left: calc(50% - 11px); width: 22px; height: 22px; border: 1px solid color-mix(in srgb, var(--pin) 85%, white); border-radius: 50%; background: var(--pin); box-shadow: inset 0 0 0 2px #ffffff36, 0 2px 2px #543b2559; }
    .screen { position: relative; overflow: hidden; aspect-ratio: var(--ratio); border: 1px solid #d7cdb9; background: #111827; }
    img { position: absolute; left: var(--left); top: var(--top); width: var(--width); max-width: none; height: auto; display: block; }
  </style>
  <body>
    <main class="board">{{SHOTS}}</main>
  </body>
</html>
